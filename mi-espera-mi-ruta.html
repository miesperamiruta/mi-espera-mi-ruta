 ${!med&&h`<${Sec} t="Actualizar estado administrativo"><select className=${IN} value=${es} onChange=${e=>ses(e.target.value)} aria-label="Estado">${Opts(['Solicitud recibida','Documentación pendiente','Documentación recibida','Contacto realizado','Hora asignada'])}</select>
  ${es==='Hora asignada'&&h`<div className="grid grid-cols-2 gap-2"><input type="date" className=${IN+' mt-2'} value=${hd} onChange=${e=>shd(e.target.value)} aria-label="Fecha"/><input type="time" className=${IN+' mt-2'} value=${ht} onChange=${e=>sht(e.target.value)} aria-label="Hora"/></div>`}
  <${Btn} c="w-full mt-3" onClick=${apply}>Registrar estado<//><p className="text-xs mt-2">Este panel no modifica prioridades clínicas.</p><//>`}
 <${Sec} t=${med?'Solicitar antecedente médico':'Solicitar documento'}><label className="block text-sm font-bold">Documento solicitado<input className=${IN} value=${dn} onChange=${e=>sdn(e.target.value)}/></label><label className="block text-sm font-bold mt-2">Motivo<input className=${IN} value=${mo} onChange=${e=>smo(e.target.value)}/></label>
  <div className="grid grid-cols-2 gap-2"><label className="block text-sm font-bold mt-2">Fecha límite (opcional)<input type="date" className=${IN} value=${fl} onChange=${e=>sfl(e.target.value)}/></label><label className="block text-sm font-bold mt-2">Entrega<select className=${IN} value=${md} onChange=${e=>smd(e.target.value)}>${Opts(['Digital','Presencial','Digital o presencial'])}</select></label></div>
  <label className="block text-sm font-bold mt-2">Indicaciones<input className=${IN} value=${ind} onChange=${e=>sind(e.target.value)}/></label><${Btn} c="w-full mt-3" onClick=${reqDoc}>Guardar y avisar al tutor<//><//>
 ${med&&h`<${Sec} t="Registrar indicación (demostración)"><textarea rows="2" className=${IN} placeholder="Indicación ficticia, sin datos reales" value=${ix} onChange=${e=>six(e.target.value)}></textarea><${Btn} c="w-full mt-2" onClick=${indic}>Registrar indicación<//><p className="text-xs mt-2">No es una receta ni una ficha clínica oficial.</p><//>`}
 ${!med&&h`<${Sec} t="Registrar llamada"><div className="grid grid-cols-2 gap-2"><select className=${IN} value=${cm} onChange=${e=>scm(e.target.value)} aria-label="Motivo">${Opts(['Confirmar datos de contacto','Agendamiento de hora','Solicitud de documentos','Otro motivo administrativo'])}</select><select className=${IN} value=${cr} onChange=${e=>scr(e.target.value)} aria-label="Resultado">${Opts(['Contestó','No contestó','Número incorrecto','Pendiente'])}</select></div><${Btn} c="w-full mt-3" onClick=${call}>Registrar llamada (${today()})<//><//>
  ${rq.length>0&&h`<${Sec} t="Solicitudes de datos">${rq.map(r=>h`<div key=${r.id} className="flex justify-between items-center gap-2 text-sm"><span>${r.campo}: ${r.valor}</span><${Btn} v="s" c="!min-h-[44px]" onClick=${()=>confirm(r)}>Confirmar<//></div>`)}<//>`}`}
 <${Sec} t="Documentos del paciente (ficticios)">${docs.length===0&&h`<p className="text-sm">Sin documentos.</p>`}${docs.map(d=>h`<div key=${d.id} className="border-b border-sky py-2 text-sm"><b>${d.doc}</b> · ${d.mod} · Estado: <b>${d.est}</b>${d.arch?' · '+d.arch:''}
  <div className="flex gap-2 flex-wrap mt-1">${med?h`<${Btn} v="s" c="!min-h-[44px]" onClick=${()=>setE(d,'En revisión')}>Requiere revisión clínica<//>`:[['Recibido','Registrar recepción presencial',1],['En revisión','En revisión'],['Completado','Completado'],['Requiere corrección','Requiere corrección']].map(([e,l,pr])=>h`<${Btn} key=${e} v="s" c="!min-h-[44px] !px-3 text-sm" onClick=${()=>setE(d,e,pr)}>${l}<//>`)}</div></div>`)}<//>
 <${Sec} t="Historial de gestiones"><ul className="text-sm space-y-1">${s.log.filter(l=>l.pid===k).slice(0,8).map((l,i)=>h`<li key=${i}><b>${l.f}</b> · ${l.t}</li>`)}</ul><//></div>`}

function Pick({role}){const{s}=useS();const[q,sq]=useState('');const[sel,ss]=useState(null);
 if(sel)return h`<div><button className="underline font-bold min-h-[44px]" onClick=${()=>ss(null)}>← Volver a pacientes</button><${Ficha} k=${sel} role=${role}/></div>`;
 const r=Object.keys(PATS).filter(k=>(k+' '+PATS[k].n+' '+PATS[k].rut+' '+PATS[k].tut).toLowerCase().includes(q.toLowerCase()));
 return h`<div><label className="font-bold" htmlFor="bq">Buscar paciente</label><input id="bq" value=${q} onChange=${e=>sq(e.target.value)} placeholder="Nombre, apellido, RUT o N.º de solicitud" className=${IN}/><div className="mt-3 space-y-2">${r.length===0&&h`<p>Sin resultados.</p>`}${r.map(k=>h`<button key=${k} onClick=${()=>ss(k)} className="w-full text-left bg-warm rounded-2xl p-4 shadow border border-sky min-h-[64px]"><b>${PATS[k].n}</b> · ${k}<br/><span className="text-sm">${PATS[k].esp} · ${getStages(s.stage[k],s.hora[k])[s.stage[k]].t}</span></button>`)}</div></div>`}

function Ventanilla(){const{s}=useS();const[t,st]=useState('p');const pend=s.docs.filter(d=>DOCEST.includes(d.est)).length;
 return h`<div><div className="flex gap-2 mb-4">${[['p','Panel'],['b','Pacientes']].map(([k,l])=>h`<button key=${k} onClick=${()=>st(k)} className=${'min-h-[44px] px-4 rounded-full font-bold border-2 border-deep '+(t===k?'bg-deep text-white':'bg-warm')}>${l}</button>`)}</div>
 ${t==='p'?h`<div><div className="grid grid-cols-2 gap-3">${[['Solicitudes activas',Object.keys(PATS).length],['Documentos pendientes',pend],['Gestiones registradas',s.log.length],['Intentos de contacto',s.calls.length]].map(([a,b])=>h`<${Card} key=${a} c="!p-4 text-center"><p className="text-3xl font-extrabold">${b}</p><p className="text-sm font-bold">${a}</p><//>`)}</div><h2 className="font-extrabold text-lg mt-5 mb-2">Gestiones recientes</h2><${Card}><ul className="space-y-2 text-sm">${s.log.slice(0,8).map((l,i)=>h`<li key=${i}><b>${l.f}</b> · ${PATS[l.pid].n}: ${l.t}</li>`)}</ul><//></div>`:h`<${Pick} role="ventanilla"/>`}</div>`}

function Orient(){const{s,act,toast}=useS();const[f,sf]=useState('Todas');const[o,so]=useState(null);const[r,sr]=useState('');const[dv,sdv]=useState('Ventanilla administrativa');
 const L=s.queries.filter(q=>f==='Todas'||q.cat===f);const n=e=>s.queries.filter(q=>q.est===e).length;const q=s.queries.find(x=>x.id===o);
 const open=x=>{so(x.id);sr(x.resp||'');if(x.est==='Nueva')act(d=>{d.queries.find(y=>y.id===x.id).est='Pendiente'})};
 const up=(fn,m)=>{act(d=>{fn(d.queries.find(y=>y.id===o),d)});toast(m)};
 const freq=CATS.map(c=>[c,s.queries.filter(x=>x.cat===c).length]).sort((a,b)=>b[1]-a[1]);
 return h`<div><div className="grid grid-cols-2 gap-3">${[['nuevas','Nueva'],['pendientes','Pendiente'],['respondidas','Respondida'],['derivadas','Derivada']].map(([a,b])=>h`<${Card} key=${a} c="!p-4 text-center"><p className="text-3xl font-extrabold">${n(b)}</p><p className="text-sm font-bold">Consultas ${a}</p><//>`)}</div>
 ${!q&&h`<div><div className="flex gap-2 flex-wrap my-4">${['Todas',...CATS].map(c=>h`<button key=${c} onClick=${()=>sf(c)} className=${'min-h-[44px] px-3 rounded-full font-bold border-2 border-deep text-sm '+(f===c?'bg-deep text-white':'bg-warm')}>${c}</button>`)}</div>
  ${L.length===0&&h`<p>No hay consultas. Envía una desde Ayuda, como tutor.</p>`}<div className="space-y-2">${L.map(x=>h`<button key=${x.id} onClick=${()=>open(x)} className=${'w-full text-left bg-warm rounded-2xl p-4 shadow border-2 min-h-[64px] '+(x.est==='Nueva'?'border-coral':'border-sky')}><b>${x.cat}</b> · ${x.est}<br/><span className="text-sm">${PATS[x.pid].tut} · ${x.f}</span></button>`)}</div>
  <${Sec} t="Dudas más frecuentes">${freq.map(([c,v])=>h`<div key=${c} className="flex items-center gap-2 text-sm"><span className="w-40">${c}</span><span className="h-3 rounded bg-teal" style=${{width:v*24+'px'}}></span> ${v}</div>`)}<//></div>`}
 ${q&&h`<div className="mt-4"><button className="underline font-bold min-h-[44px]" onClick=${()=>so(null)}>← Volver a la bandeja</button>
  <${Sec} t=${'Consulta '+q.id}><p className="text-sm"><b>Tutor/a:</b> ${PATS[q.pid].tut} · <b>Paciente:</b> ${PATS[q.pid].n}<br/>${q.cat} · ${q.f} · Estado: <b>${q.est}</b></p><p className="bg-cream rounded-xl p-3 mt-2">${q.msg}</p>
  <label className="block text-sm font-bold mt-3">Respuesta<textarea rows="3" className=${IN} value=${r} onChange=${e=>sr(e.target.value)}></textarea></label>
  <${Btn} c="w-full mt-2" onClick=${()=>{if(!r.trim())return toast('Escribe una respuesta.');up((x,d)=>{x.resp=r.trim();x.est='Respondida';logit(d,x.pid,'Consulta respondida por Orientación');notify(d,x.pid,'Tienes una respuesta a tu consulta','Loreto Medel respondió tu consulta. Léela en Ayuda.','help','mail')},'Respuesta enviada al tutor.')}}>Responder<//>
  <div className="grid grid-cols-2 gap-2 mt-3"><select className=${IN} value=${dv} onChange=${e=>sdv(e.target.value)} aria-label="Derivar a">${Opts(['Ventanilla administrativa','Profesional médico','CESFAM de origen'])}</select><${Btn} v="s" onClick=${()=>up((x,d)=>{x.est='Derivada';x.deriv='Derivada a '+dv;logit(d,x.pid,'Consulta derivada a '+dv)},'Consulta derivada.')}>Derivar<//></div>
  <${Btn} v="y" c="w-full mt-3" onClick=${()=>up((x,d)=>{x.est='Resuelta';logit(d,x.pid,'Consulta resuelta')},'Marcada como resuelta.')}>Marcar como resuelta<//><//>
  <${Sec} t="Historial permitido (solo gestiones, sin datos clínicos)"><ul className="text-sm space-y-1">${s.log.filter(l=>l.pid===q.pid).slice(0,6).map((l,i)=>h`<li key=${i}><b>${l.f}</b> · ${l.t}</li>`)}</ul><//></div>`}</div>`}

function Staff({role}){const T={ventanilla:'Ventanilla administrativa',orient:'Orientación hospitalaria · Loreto Medel',medico:'Profesional médico'}[role];
 return h`<div className="min-h-screen bg-gradient-to-b from-sky/40 to-warm"><header className="bg-teal text-white px-4 py-4 flex items-center gap-3"><${Logo} s=${40}/><div><p className="font-extrabold">Mi espera, mi ruta · Panel</p><p className="text-sm">${T}</p></div></header>
 <main className="max-w-3xl mx-auto p-4 pb-16">${role==='ventanilla'?h`<${Ventanilla}/>`:role==='orient'?h`<${Orient}/>`:h`<${Pick} role="medico"/>`}<p className="text-xs text-center mt-6">Prototipo académico con datos ficticios. No es un sistema oficial autorizado por el hospital. Los datos se guardan solo en este navegador.</p></main></div>`}

function Root(){const[s,setS]=useState(load);const[role,sr]=useState(null);const[tt,stt]=useState('');
 const toast=t=>{stt(t);setTimeout(()=>stt(''),3500)};
 const act=fn=>setS(p=>{const d=JSON.parse(JSON.stringify(p));fn(d);try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d});
 const reset=()=>{try{localStorage.removeItem(KEY)}catch(e){}setS(INIT());toast('Demostración restablecida.')};
 if(!role)return h`<${Login} ok=${sr}/>`;
 const pid=role==='adult'?'S-1088':'S-1042';
 return h`<${Ctx.Provider} value=${{s,act,pid,role,toast}}>
 <div className="sticky top-0 z-40 bg-deep text-white text-xs px-3 py-1.5 flex flex-wrap items-center gap-x-3"><span className="font-extrabold">🧪 Modo demostración</span>
  <select aria-label="Cambiar de perfil" value=${role} onChange=${e=>sr(e.target.value)} className="text-deep rounded-lg px-2 min-h-[32px] font-bold">${[['tutor','Tutora · Camila Torres'],['adult','Paciente mayor de edad'],['ventanilla','Ventanilla administrativa'],['orient','Orientación (Loreto)'],['medico','Profesional médico']].map(([v,l])=>h`<option key=${v} value=${v}>${l}</option>`)}</select>
  <button onClick=${reset} className="underline font-bold min-h-[32px]">Restablecer demostración</button><button onClick=${()=>sr(null)} className="underline min-h-[32px]">Salir</button>
  <span className="hidden md:inline opacity-80">Selector solo para la presentación; no es un mecanismo de seguridad.</span></div>
 ${['ventanilla','orient','medico'].includes(role)?h`<${Staff} role=${role}/>`:h`<${TutorView} key=${role} role=${role} out=${()=>sr(null)}/>`}
 ${tt&&h`<div role="status" className="fixed z-50 left-4 right-4 bottom-24 md:bottom-6 md:left-auto md:max-w-sm bg-deep text-white rounded-2xl p-4 shadow-xl font-semibold">${tt}</div>`}
 <//>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${Root}/>`);
</script>
</body>
</html>
